# [TradeMaster] Per-timeframe run settings shared by every profile (docs/macrohft_inputs.md 5.7).
# chunk: market-type chunk for the sub-agents (upstream 4320 1-minute bars = 3 days)
# context_window: slope_<w>/vol_<w> context of the hyper-agent (upstream 360 = 6 hours)
# memory_capacity: episodic memory size in steps (upstream 4320 = one chunk)
# warmup_bars: history computed before the train start and then dropped (>= the longest feature window)
15m: {interval: 15m, chunk: 288, context_window: 96, memory_capacity: 288, warmup_bars: 1200}
1h:  {interval: 1h,  chunk: 168, context_window: 48, memory_capacity: 168, warmup_bars: 1200}
